language: csharp

groups:
  call: [invocation_expression]
  expression: [identifier, integer_literal, real_literal, string_literal, character_literal, boolean_literal, null_literal, interpolated_string_expression, interpolation, invocation_expression, member_access_expression, object_creation_expression, array_creation_expression, element_access_expression, conditional_access_expression, conditional_expression, binary_expression, assignment_expression, prefix_unary_expression, postfix_unary_expression, cast_expression, as_expression, is_expression, typeof_expression, sizeof_expression, await_expression, lambda_expression, anonymous_method_expression, query_expression, parenthesized_expression, tuple_expression, throw_expression, range_expression, switch_expression, with_expression, collection_expression, implicit_object_creation_expression, base_expression, this_expression, member_binding_expression, cref_expression]
  expressionExcluded: [type_annotation, type_arguments, type_parameters, type_parameter, type_parameter_list, type_argument_list, type_identifier, predefined_type, implicit_type, nullable_type, function_type, generic_type, generic_name, qualified_name, alias_qualified_name, type_projection, type_alias, array_type, tuple_type, pointer_type, ref_type, scoped_type, function_pointer_type, nullable_directive]
  navigation: [member_access_expression]
  calleeSuffix: [identifier]
  callSuffix: [argument_list]
  identifier: [identifier]
  import: [using_directive]
  property: [variable_declarator, property_declaration]
  variable: [variable_declaration]
  function: [method_declaration, local_function_statement, constructor_declaration]
  functionBody: [block, arrow_expression_clause]
  if: [if_statement]
  loop: [while_statement, for_statement, foreach_statement, do_statement]
  controlBody: [block]
  else: [else]
  elseClause: []
  statementList: [block]
  statementWrapper: [expression_statement]
  jump: [return_statement, break_statement, continue_statement, throw_statement, throw_expression]
  try: [try_statement]
  catch: [catch_clause]
  finally: [finally_clause]
  assignment: [assignment_expression]
  assignable: []
  increment: [postfix_unary_expression, prefix_unary_expression]
  write: [assignment_expression, postfix_unary_expression, prefix_unary_expression]
  guard: [if_statement, while_statement, for_statement, foreach_statement, do_statement]
  annotation: [attribute]
  modifier: [attribute_list]
  comment: [comment]
  lambda: [lambda_expression]
  object: [object_creation_expression]
  class: [class_declaration, struct_declaration, interface_declaration, record_declaration, enum_declaration]
  classBody: [declaration_list]
  callArgument: [argument]
  parameter: [parameter]
  parameterList: [parameter_list]
  bindingName: [identifier]
  pattern: [tuple_pattern]
  binding: [variable_declarator]
  loopBindingContainer: [foreach_statement]
  typeReference: [predefined_type]
  declarationWrapper: [variable_declaration, local_declaration_statement, field_declaration]
  blockClose: ["}"]
  openBrace: ["{"]
  equals: ["="]
  ifToken: [if]
  elseToken: [else]
  loopToken: [while, for, foreach, do]
  tryToken: [try]
  conditionExcluded: ["(", ")"]
  loopConditionExcluded: ["(", ")"]
  parenthesized: [parenthesized_expression]
  reference: [identifier, member_access_expression, invocation_expression, predefined_type]
  effect: [invocation_expression, assignment_expression, postfix_unary_expression, prefix_unary_expression, object_creation_expression, await_expression, throw_statement, throw_expression, lambda_expression]
  effectFragment: []

operators:
  increment: ["++", "--"]

tokens:
  importPrefix: "using"
  throwKeyword: "throw"

keywords:
  exit: [return, break, continue]

fields:
  ifCondition: [condition]
  ifThen: [consequence]
  ifElse: [alternative]
  loopCondition: [condition]
  loopBody: [body]
  loopBinding: [left]
  functionBody: [body]
  functionName: [name]
  variableName: [name]
  variableValue: [value]
  callFunction: [function]
  memberObject: [expression]
  memberProperty: [name]
  tryBody: [body]
  returnArgument: []
  importSource: []
