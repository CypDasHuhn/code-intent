language: kotlin

groups:
  call: [call_expression]
  expression: [call_expression, navigation_expression, simple_identifier, string_literal, character_literal, integer_literal, hex_literal, real_literal, boolean_literal, null, collection_literal, function_literal, object_literal, lambda_literal, annotated_lambda, parenthesized_expression, indexing_expression, range_expression, additive_expression, multiplicative_expression, conjunction_expression, disjunction_expression, equality_expression, comparison_expression, elvis_expression, infix_expression, unary_expression, prefix_expression, postfix_expression, as_expression, is_expression, if_expression, when_expression, try_expression, jump_expression, assignment, directly_assignable_expression, this_expression, super_expression, spread_expression, type_test_expression, binary_expression, string_template, interpolated_identifier, callable_reference, anonymous_function]
  expressionExcluded: [type_annotation, type_arguments, type_parameters, type_parameter, type_identifier, predefined_type, implicit_type, nullable_type, function_type, generic_type, type_projection, type_alias, user_type, parenthesized_type, definitely_non_nullable_type, intersection_type, dynamic_type, captured_type, variance_modifier]
  navigation: [navigation_expression]
  calleeSuffix: [navigation_suffix]
  callSuffix: [call_suffix]
  identifier: [simple_identifier]
  import: [import_header]
  property: [property_declaration]
  variable: [variable_declaration]
  function: [function_declaration]
  functionBody: [function_body]
  if: [if_expression]
  loop: [while_statement, for_statement]
  controlBody: [control_structure_body]
  else: [else]
  statementList: [statements]
  jump: [jump_expression]
  try: [try_expression]
  catch: [catch_block]
  finally: [finally_block]
  assignment: [assignment]
  assignable: [directly_assignable_expression]
  increment: [postfix_expression, prefix_expression]
  write: [assignment, postfix_expression, prefix_expression]
  guard: [if_expression, while_statement, for_statement]
  annotation: [annotation]
  modifier: [modifiers]
  comment: [comment, line_comment, multiline_comment]
  lambda: [annotated_lambda, lambda_literal]
  declarationWrapper: [property_declaration, function_declaration]
  object: [object_literal, object_declaration]
  class: [class_declaration, object_declaration, companion_object, object_literal]
  classBody: [class_body]
  callArgument: []
  parameter: [parameter]
  parameterList: []
  bindingName: [simple_identifier]
  pattern: []
  binding: [variable_declaration, multi_variable_declaration]
  loopBindingContainer: []
  typeReference: [user_type]
  blockClose: ["}"]
  openBrace: ["{"]
  equals: ["="]
  ifToken: [if]
  elseToken: [else]
  loopToken: [while, for, in]
  tryToken: [try]
  conditionExcluded: ["(", ")", control_structure_body]
  loopConditionExcluded: ["(", ")", control_structure_body]
  reference: [simple_identifier, navigation_expression, call_expression, user_type]
  effect: [call_expression, assignment, jump_expression, lambda_literal, annotated_lambda, object_literal, object_declaration]
  effectFragment: [assignment, lambda, object, increment, decrement]

operators:
  increment: ["++", "--"]

tokens:
  importPrefix: "import"
  throwKeyword: "throw"

keywords:
  exit: [return, continue, break]
