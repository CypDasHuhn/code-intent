language: typescript

groups:
  call: [call_expression]
  expression: [identifier, property_identifier, private_property_identifier, shorthand_property_identifier, shorthand_property_identifier_pattern, string, template_string, number, regex, true, false, null, undefined, this, super, call_expression, member_expression, subscript_expression, new_expression, await_expression, yield_expression, binary_expression, unary_expression, update_expression, assignment_expression, augmented_assignment_expression, ternary_expression, sequence_expression, arrow_function, function_expression, class, object, array, spread_element, parenthesized_expression, optional_chain, tagged_template, jsx_element, jsx_self_closing_element, type_assertion, as_expression, satisfies_expression, non_null_expression, instantiation_expression]
  expressionExcluded: [type_annotation, type_arguments, type_parameters, type_parameter, type_identifier, predefined_type, implicit_type, nullable_type, function_type, generic_type, type_projection, type_alias, union_type, intersection_type, array_type, tuple_type, object_type, parenthesized_type, type_predicate, literal_type, conditional_type, optional_type, rest_type, constructor_type, index_type_query, lookup_type, mapped_type, template_literal_type, infer_type, this_type, query_type, readonly_type]
  navigation: [member_expression]
  calleeSuffix: [property_identifier, private_property_identifier]
  callSuffix: [arguments]
  identifier: [identifier, property_identifier, private_property_identifier, shorthand_property_identifier, shorthand_property_identifier_pattern]
  import: [import_statement]
  property: [variable_declarator, public_field_definition]
  variable: []
  function: [function_declaration, generator_function_declaration, method_definition]
  functionBody: [statement_block]
  if: [if_statement]
  loop: [for_statement, for_in_statement, while_statement, do_statement]
  controlBody: [statement_block]
  else: [else]
  elseClause: [else_clause]
  statementList: [statement_block, program]
  statementWrapper: [expression_statement]
  jump: [return_statement, break_statement, continue_statement, throw_statement]
  try: [try_statement]
  catch: [catch_clause]
  finally: [finally_clause]
  assignment: [assignment_expression, augmented_assignment_expression]
  assignable: []
  increment: [update_expression]
  write: [assignment_expression, augmented_assignment_expression, update_expression]
  guard: [if_statement, for_statement, for_in_statement, while_statement, do_statement]
  annotation: [decorator]
  modifier: []
  comment: [comment]
  lambda: [arrow_function, function_expression]
  object: [object]
  class: [class_declaration, class, abstract_class_declaration, interface_declaration]
  classBody: [class_body]
  callArgument: []
  parameter: [required_parameter, optional_parameter]
  parameterList: [formal_parameters]
  bindingName: [identifier, shorthand_property_identifier_pattern, shorthand_property_identifier]
  pattern: [array_pattern, object_pattern, rest_pattern]
  patternBinding: [assignment_pattern, object_assignment_pattern, pair_pattern]
  binding: [variable_declarator]
  loopBindingContainer: [for_in_statement]
  typeReference: [type_identifier, predefined_type]
  declarationWrapper: [lexical_declaration, export_statement]
  blockClose: ["}"]
  openBrace: ["{"]
  equals: ["="]
  ifToken: [if]
  elseToken: [else]
  loopToken: [while, for, do]
  tryToken: [try]
  conditionExcluded: ["(", ")"]
  loopConditionExcluded: ["(", ")"]
  parenthesized: [parenthesized_expression]
  reference: [identifier, property_identifier, private_property_identifier, member_expression, call_expression, type_identifier, predefined_type]
  effect: [call_expression, assignment_expression, augmented_assignment_expression, update_expression, new_expression, yield_expression, await_expression, throw_statement, arrow_function, function_expression, object]
  effectFragment: []

operators:
  increment: ["++", "--"]

tokens:
  importPrefix: "import"
  throwKeyword: "throw"

keywords:
  exit: [return, break, continue]

fields:
  ifCondition: [condition]
  ifThen: [consequence]
  ifElse: [alternative]
  loopCondition: [condition]
  loopBody: [body]
  loopBinding: [left]
  functionBody: [body]
  functionName: [name]
  variableName: [name, property]
  patternBinding: [left, value]
  variableValue: [value]
  callFunction: [function]
  memberObject: [object]
  memberProperty: [property]
  tryBody: [body]
  returnArgument: [argument]
  importSource: [source]
