javascript-logging: &javascript-logging
  printCalls: [log, error, warn, info, debug, trace]
  printQualifiers: [console]
  methods: [log, info, warn, error, debug, trace, verbose, fatal]
  types: []
  factories: [createLogger, pino]
  receiverNames: [log, logger, LOG, LOGGER, Logger]
  qualifiers: []
  guardNames: [loggingEnabled, logEnabled, debugEnabled, logging]
  imports: []

javascript-error: &javascript-error
  calls: [assert, invariant]
  throws: true

intents:
  LOGGING:
    blocks: [print, logger-interaction, logging-state]
    params:
      printCalls: [println, print]
      printQualifiers: [System.out, System.err]
      methods: [info, debug, warn, error, trace, log, verbose, fatal]
      types:
        - org.slf4j.Logger
        - org.apache.logging.log4j.Logger
        - java.util.logging.Logger
      factories:
        - LoggerFactory.getLogger
        - KotlinLogging.logger
        - LogManager.getLogger
        - Logger.getLogger
      receiverNames: [log, logger, LOG, LOGGER, Logger]
      qualifiers: [System.out, System.err]
      guardNames: [loggingEnabled, logEnabled, debugEnabled, logging]
      imports:
        - org.slf4j
        - mu.KotlinLogging
        - java.util.logging
    overrides:
      javascript: *javascript-logging
      typescript: *javascript-logging

  BOOKKEEPING:
    blocks: [bookkeeping]

  ERROR_HANDLING:
    blocks: [error-handling]
    params:
      calls: [require, requireNotNull, check, checkNotNull, error, TODO, assert]
      throws: true
    overrides:
      javascript: *javascript-error
      typescript: *javascript-error

  VALIDATION:
    blocks: [validation]
    params:
      predicates:
        - none
        - any
        - all
        - isEmpty
        - isNotEmpty
        - isBlank
        - isNotBlank
        - isNullOrBlank
        - isNullOrEmpty
        - contains
        - containsKey
        - containsValue
        - startsWith
        - endsWith
        - matches
      predicatePrefixes: [is, has]

purity:
  annotations:
    - Pure
    - Contract(pure = true)
    - org.checkerframework.dataflow.qual.Pure
